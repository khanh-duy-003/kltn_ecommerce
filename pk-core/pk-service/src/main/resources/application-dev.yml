# Cấu hình chung. Bí mật (DB, khoá JWT) lấy từ biến môi trường, KHÔNG commit giá trị thật.
spring:
  application:
    name: pk-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kltn_ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:khanhduy003}
  flyway:
    enabled: false # TODO: tạm tắt để start được app - DB kltn_ecommerce đang có bảng sẵn nhưng thiếu flyway_schema_history (bật lại true sau khi xử lý xong, xem 00-GHI-NHO-DU-AN.md ngày 2026-09-25)
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8082}
  shutdown: graceful

app:
  mirage:
    dialect: ${MIRAGE_DIALECT:postgresql}   # postgresql | h2 (test)
  jwt:
    issuer: pk-core
    access-token-minutes: 15
    refresh-token-days: 14
    # PEM (PKCS#8 private / X.509 public). Để trống => khoá tạm chỉ dùng dev. Xem README để sinh khoá.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://jewelry-ecommerce-client.vercel.app}
  seed:
    enabled: ${SEED_ENABLED:false}
  otp:
    # Chỉ để dev/demo (chưa tích hợp SMS): đặt OTP_FIXED_CODE=123456 để mọi OTP đều là mã đó; để trống = mã ngẫu nhiên
    # ghi vào log (xem LogOtpSender). KHÔNG đặt ở môi trường thật.
    fixed-code: ${OTP_FIXED_CODE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
