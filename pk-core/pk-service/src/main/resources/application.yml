# Cấu hình chung. Bí mật (DB, khoá JWT) lấy từ biến môi trường, KHÔNG commit giá trị thật.
spring:
  application:
    name: pk-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pk_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  mirage:
    dialect: ${MIRAGE_DIALECT:postgresql}   # postgresql | h2 (test)
  jwt:
    issuer: pk-core
    access-token-minutes: 15
    refresh-token-days: 14
    # PEM (PKCS#8 private / X.509 public). Để trống => khoá tạm chỉ dùng dev. Xem README để sinh khoá.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://jewelry-ecommerce-client.vercel.app}
  seed:
    enabled: ${SEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
